# Build + full test suite on every push and every pull request, on every branch.
#
# Separate from nuget-publish.yml deliberately: publishing is gated on main/tags,
# but a feature branch needs to know it is green BEFORE it opens a PR. This
# workflow never publishes anything.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 9.0.x as well as 8.0.x: the solution is a .slnx, and .slnx support only
      # arrived in the 9.0.2xx SDK. Our global.json rolls forward to latestMajor
      # so this currently works off whatever the runner image ships - installing
      # 9.0.x explicitly makes that deterministic instead of incidental.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Hash every fixture against tests/corpus/MANIFEST.sha256 BEFORE building.
      # A missing, truncated, edited or newline-mangled .mdb otherwise surfaces
      # as a baffling parser failure a long way from the cause; this turns it
      # into one line naming the file. Runs first so it costs 2s to rule out.
      - name: Verify test corpus
        shell: pwsh
        run: ./tools/corpus.ps1

      # Record WHAT was tested against, so a build log is self-contained
      # evidence months from now without re-deriving it from the commit.
      - name: Record corpus provenance
        shell: pwsh
        run: |
          $m = Get-FileHash tests/corpus/MANIFEST.sha256 -Algorithm SHA256
          $n = (Get-ChildItem tests/corpus -Recurse -File -Include *.mdb,*.accdb).Count
          "### Test corpus`n"                                   >> $env:GITHUB_STEP_SUMMARY
          "- fixtures: **$n**"                                  >> $env:GITHUB_STEP_SUMMARY
          "- manifest sha256: ``$($m.Hash.ToLower())``"         >> $env:GITHUB_STEP_SUMMARY
          "- commit: ``$env:GITHUB_SHA``"                       >> $env:GITHUB_STEP_SUMMARY

      - name: Restore
        run: dotnet restore JackcessDotNet.slnx

      # The library multi-targets net472 and net8.0; build both so a net472-only
      # break (missing BCL surface, see Util/FrameworkCompat.cs) fails here and
      # not in a downstream consumer.
      - name: Build (net472 + net8.0)
        run: dotnet build JackcessDotNet.slnx --configuration Release --no-restore

      # No --filter. The whole suite runs, corpus tests included: they are the
      # only thing that checks this parser against files real Access wrote.
      - name: Test
        run: dotnet test JackcessDotNet.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
