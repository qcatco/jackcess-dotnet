name: build & publish

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sourcelink needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore JackcessDotNet.slnx

      - name: Build
        run: dotnet build JackcessDotNet.slnx --configuration Release --no-restore

      - name: Test
        # The corpus theories read the Java Jackcess test corpus, which is not in
        # this repository and is not present on GitHub-hosted runners. xUnit treats
        # a [Theory] with no data as a FAILURE rather than a skip, so they are
        # filtered out here - without this the whole run is red and the pipeline
        # stops being a useful signal.
        #
        # To run them, provide the corpus and drop the filter:
        #   $env:JACKCESS_CORPUS_PATH = 'path/to/jackcess-5.0.0/src/test/resources/data'
        #   dotnet test JackcessDotNet.slnx -c Release
        #
        # Tests now also run on tag pushes: with the run green there is no reason
        # to publish a release without them.
        run: >
          dotnet test JackcessDotNet.slnx --configuration Release --no-build --verbosity normal
          --filter "FullyQualifiedName!~CorpusTests&FullyQualifiedName!~OnCorpusFile"

      - name: Upload package artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: nuget   # optional GitHub Environment with manual approval
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push artifacts/*.nupkg `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
