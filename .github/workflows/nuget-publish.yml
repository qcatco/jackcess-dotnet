name: build & publish

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sourcelink needs full history

      # 9.0.x as well as 8.0.x: the solution is a .slnx, and .slnx support only
      # arrived in the 9.0.2xx SDK. Restore fails outright on 8.0.x with
      # "MSB4068: The element <Solution> is unrecognized", which is why this
      # workflow has not built since global.json pinned the SDK - it never got
      # as far as compiling, let alone testing. Output still targets net8.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Hash every fixture in tests/corpus against MANIFEST.sha256 before doing
      # anything else. A truncated checkout, a fixture edited in place or a .mdb
      # mangled by a newline filter otherwise surfaces as a parser failure a long
      # way from its cause; this turns it into one line naming the file.
      - name: Verify test corpus
        shell: pwsh
        run: ./tools/corpus.ps1

      - name: Restore
        run: dotnet restore JackcessDotNet.slnx

      - name: Build
        run: dotnet build JackcessDotNet.slnx --configuration Release --no-restore

      # No --filter: the corpus tests run too. They are the only thing checking
      # this parser against files real Access wrote, so excluding them would
      # leave the most valuable coverage switched off.
      #
      # Runs on tag pushes as well - with the suite green there is no reason to
      # publish a release that was never tested.
      - name: Test
        run: dotnet test JackcessDotNet.slnx --configuration Release --no-build --verbosity normal

      # Records WHAT the run tested against, so a build log stays self-contained
      # evidence without re-deriving it from the commit.
      - name: Record corpus provenance
        shell: pwsh
        run: |
          $m = Get-FileHash tests/corpus/MANIFEST.sha256 -Algorithm SHA256
          $n = (Get-ChildItem tests/corpus -Recurse -File -Include *.mdb,*.accdb).Count
          "### Test corpus`n"                           >> $env:GITHUB_STEP_SUMMARY
          "- fixtures: **$n**"                          >> $env:GITHUB_STEP_SUMMARY
          "- manifest sha256: ``$($m.Hash.ToLower())``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload package artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: nuget   # optional GitHub Environment with manual approval
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push artifacts/*.nupkg `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
